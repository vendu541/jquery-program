<!DOCTYPE html>
<html>
<head>
    <title>jQuery Program</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<button id="btn">Click Me</button>

<script>
$(document).ready(function() {
    $("#btn").click(function() {
        alert("Hello jQuery!");
    });
});
</script>

</body>
</html>
